# Pipeline behaviour. Secrets belong in .env, never here.
# Precedence: CLI flag > environment variable > this file > code defaults.

source:
  # Leave empty to use tools/bin/ (see `python tools/bootstrap.py`)
  # or whatever is on PATH. Set it only to pin a specific binary.
  yt_dlp_path: ""
  format: "299+140/bestvideo[height<=1080][vcodec^=avc1]+bestaudio[ext=m4a]/best"

whisper:
  model: small
  compute_type: int8
  # Stepped down automatically if the RAM preflight fails, and the downgrade
  # is recorded in quality_report.json so a run is never silently degraded.
  fallback_ladder: [large-v3, medium, small]
  # "auto" = this machine's physical core count, so moving the checkout to
  # another box needs no edit. SMT siblings are excluded on purpose: this is
  # an int8 GEMM workload that already saturates the execution units.
  cpu_threads: auto
  num_workers: 1
  beam_size: 1
  language: tr
  # The single most important flag. With it enabled, large-v3 on a 60-minute
  # Turkish panel eventually enters a repetition loop and poisons everything
  # after it. Disabling costs a little cross-sentence coherence and buys
  # enormous robustness.
  condition_on_previous_text: false
  vad_filter: true
  vad:
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 700
    # Stops VAD clipping Turkish word-final consonants, which is exactly
    # where the graded morphology lives.
    speech_pad_ms: 200
  checkpoint_every_segments: 10

turkish:
  # Running Turkish text carries 60-90 diacritics per 1000 chars. Below this
  # floor the model has systematically ASCII-folded and the stage fails loudly
  # rather than attempting token-by-token repair.
  min_diacritic_density: 35.0
  target_oov_rate: 0.06
  # Ambiguous diacritic restorations (kar/kâr, acı/açı) are left alone unless
  # one candidate is this much more frequent. Not guessing beats guessing.
  frequency_ratio_threshold: 8.0

segment:
  window_s: 480
  overlap_s: 90
  min_segment_s: 25
  max_segment_s: 300
  sentence_gap_s: 0.65

score:
  threshold: 55
  llm_passes: 1          # raise to 3 to get medians plus a stability flag
  unstable_stdev: 1.5

select:
  vertical:   {count: 3, aspect: "9:16", min_s: 20, max_s: 60}
  horizontal: {count: 2, aspect: "16:9", min_s: 60, max_s: 120}
  min_gap_s: 5
  cross_format_overlap: true   # one great moment may be both a Short and a LinkedIn cut
  relax_step: 5
  relax_floor: 40

reframe:
  # dynamic | static. `static` holds ONE window for the whole clip and never
  # snaps, which removes the jump-cut class of defect the QC pass flags.
  # It is not free and not always safe: on this source the speaker sits in a
  # very different place before and after a cut, so a single window lets them
  # stray 757px from centre against a 304px half-window -- they leave frame.
  # render.json records `max_subject_offset_px` and `subject_left_frame` so
  # that cost is visible before you ship, and the render warns out loud.
  mode: dynamic
  # Every crop snap this pipeline makes reads as a jump cut -- measured, not
  # assumed: across all six snaps in the delivered clips the subject moved
  # under 14% of frame width and changed size by under 7%, because the
  # reframer centres the speaker at a fixed crop width. Only the background
  # jumps, which is exactly what a jump cut is.
  # So the cut is marked rather than hidden: a short defocus pulse peaking on
  # it. A blur through a cut reads as an edit; a bare jump reads as a fault.
  snap_transition: true
  snap_transition_s: 0.24       # total pulse width, centred on the cut
  snap_transition_strength: 7   # peak defocus; 11 is the opening blur_reveal
  sample_fps: 6
  deadzone_frac: 0.06     # wider: stops the frame chasing detector noise
  ema_alpha: 0.12
  max_pan_px_per_s: 18    # slower: a reframe should read as intentional
  rdp_tolerance_px: 6
  detector_score_threshold: 0.6

render:
  workers: 2
  encoder: libx264        # libx264 | qsv | auto  (*_nvenc is blacklisted: no NVIDIA card)
  x264_preset: veryfast
  x264_crf: 20
  qsv_global_quality: 23
  fps: 30
  audio_bitrate: 128k
  loudnorm: true

# Opening-style effects for the first fraction of a second of each clip.
# Research is consistent that 65-71% of short-form viewers decide inside
# the first three seconds, and that a pattern interrupt -- a sudden visual
# or audio change -- is what breaks the scroll habit. These are the
# candidate interrupts; `plain` is the control they get compared against.
#
# Off by default. While disabled every clip is tagged "plain" and the
# filtergraph is byte-identical to the pre-feature output, so turning this
# on is an explicit decision rather than a silent change to every render.
render_variant:
  enabled: false
  values: [plain, blur_reveal, sound_sting]
  reveal_duration_s: 0.6   # blur_reveal: focus-pull length. Longer reads as a stall.
  reveal_max_radius: 24
  sting_delay_s: 0.5       # sound_sting: picture held blurred until the sting lands
  sting_hold_radius: 30
  sting_gain: 0.7          # under the speech, not over it
  sting_asset: assets/sfx/sting_default.wav

subtitles:
  vertical:   {font_size: 74, margin_v: 420, margin_x: 90, max_lines: 2, chars_per_line: 18}
  horizontal: {font_size: 54, margin_v: 90,  margin_x: 120, max_lines: 2, chars_per_line: 34}
  karaoke: true
  uppercase: true

llm:
  model_cheap: haiku
  model_main: sonnet
  timeout_s: 600          # measured: ~122s/call, ~99s of it time-to-first-token
  max_attempts: 3
  concurrency: 1          # 7.7 GB RAM cannot host parallel CLI sessions
  cache: true

copy:
  bilingual: true
  min_evidence_words: 6
  duplicate_jaccard_warn: 0.85

publish:
  mode: dry_run           # dry_run | live
  platforms: [linkedin, instagram, x, tiktok, youtube]
  # Route by clip shape. Instagram Reels, TikTok and Shorts are vertical-only
  # surfaces; sending a 16:9 cut there produces a letterboxed post that the
  # adapter would flag anyway. Filtering here means the mismatch never gets
  # as far as generating copy for it.
  routing_by_aspect:
    "9:16": [instagram, tiktok, youtube]
    "16:9": [linkedin, x]

metrics:
  windows: ["T+1h", "T+24h", "T+7d", "T+30d"]
  simulate_missing: true

feedback:
  enabled: true
  # Whether scoring consumes what previous videos measured. Turning this
  # off makes a run reproducible against the rubric alone, which is what
  # you want when comparing two rubric versions.
  apply_priors: true
  recency_tau_days: 90
  shrinkage_k: 8
  eta: 0.35
  multiplier_bounds: [0.80, 1.25]
  exploration_ratio: 0.20
  adapt_criterion_weights: false
  min_n_for_weight_adaptation: 40

retention:
  purge_source_after_render: true   # mandatory at scale: 20 videos/month fills the disk
  keep_clips_days: 60
  keep_runs: 30

runtime:
  min_success_ratio: 0.6
  ram_ceiling_mb: 5000
